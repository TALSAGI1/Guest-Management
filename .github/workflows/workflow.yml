name: CI + CD (Docker build, run health check, push to GHCR)

on:
  push:
    branches: ["**"]          # בכל פוש נריץ CI; נדחוף רק אם זה main
  pull_request:               # ב-PR נריץ רק CI (בלי push)
  workflow_dispatch:

jobs:
  ci_build_and_healthcheck:
    name: CI - build image and health-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag for CI
        id: meta_ci
        run: |
          echo "ci_tag=testimg:ci" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # בונים את האימג' ומטעינים אותו לשדכן המקומי כדי שנוכל להריץ אותו (load: true)
      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ steps.meta_ci.outputs.ci_tag }}

      # מריצים קונטיינר רגעית ובודקים /healthz
      - name: Run container
        run: |
          docker run -d --name app -p 8080:8080 ${{ steps.meta_ci.outputs.ci_tag }}
          # ממתינים מעט לאתחול
          for i in {1..20}; do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              echo "Health OK"; exit 0
            fi
            sleep 1
          done
          echo "Health check failed"; docker logs app || true; exit 1
      - name: Stop container
        if: always()
        run: docker rm -f app || true

  cd_build_and_push:
    name: CD - build & push to GHCR (only on main)
    needs: ci_build_and_healthcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # חובה לדחיפה ל-GHCR עם GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name + tags (lowercase)
        id: meta
        run: |
          REPO_LC="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"   # owner/repo lowercase
          echo "image=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "do_push=true"  >> "$GITHUB_OUTPUT"
          else
            echo "do_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (only on main)
        if: steps.meta.outputs.do_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # בונים תמיד; דוחפים רק אם זה main
      - name: Build (and push if main)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.meta.outputs.do_push }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.image }}:latest
