name: CI + CD (Build & Push to GHCR, no tests)

on:
  push:
    branches: ["**"]          # בכל פוש נבנה; נדחוף רק אם זה main
  pull_request:
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # דרוש לדחיפה ל-GHCR עם GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name + tags (lowercase)
        id: meta
        run: |
          # owner/repo באותיות קטנות (דרישת GHCR)
          REPO_LC="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          # נדחוף רק אם זה main
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "do_push=true"  >> "$GITHUB_OUTPUT"
          else
            echo "do_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (only on main)
        if: steps.meta.outputs.do_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build תמיד; Push רק על main
      - name: Build (and push if main)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.meta.outputs.do_push }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.image }}:latest
