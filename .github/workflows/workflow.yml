name: CI + CD (Build & Push to GHCR)

on:
  push:
    branches: ["**"]          # בכל פוש נריץ בדיקות; נדחוף אימג' רק אם זה main
  pull_request:               # ב-PR נריץ רק בדיקות (ולא נדחוף)
  workflow_dispatch:

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Pytest
        run: pytest -q

  build_and_push:
    name: Build Docker image (push only on main)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # מאפשר דחיפה ל-GHCR עם GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name + tags (lowercase)
        id: meta
        run: |
          REPO_LC="${{ toLower(github.repository) }}"        # owner/repo באותיות קטנות (דרישת GHCR)
          echo "image=ghcr.io/${REPO_LC}" >> $GITHUB_OUTPUT
          echo "tag_sha=${GITHUB_SHA::12}" >> $GITHUB_OUTPUT
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "do_push=true"  >> $GITHUB_OUTPUT
          else
            echo "do_push=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (only on main)
        if: steps.meta.outputs.do_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push if main)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.meta.outputs.do_push }}            # true רק על main
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.image }}:latest
